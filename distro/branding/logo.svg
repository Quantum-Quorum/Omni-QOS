<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f"/>
      <stop offset="100%" stop-color="#0e131d"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#00c8e0"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="960" height="420" fill="url(#bgGrad)" rx="16"/>

  <g transform="translate(190, 210)" filter="url(#softGlow)">
    <path d="M 0,-90 A 90,90 0 0,1 78,-45"
          fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round"/>

    <path d="M 78,-45 A 90,90 0 0,1 45,78"
          fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round"/>

    <path d="M 45,78 A 90,90 0 0,1 -78,45"
          fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round"/>

    <path d="M -78,45 A 90,90 0 0,1 0,-90"
          fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round"/>

    <circle cx="0" cy="0" r="42" fill="none" stroke="#00e5ff" stroke-width="5" stroke-dasharray="8 6" opacity="0.85"/>
    <circle cx="0" cy="0" r="14" fill="#00f5ff"/>

    <line x1="38" y1="38" x2="88" y2="88" stroke="#00f5ff" stroke-width="14" stroke-linecap="round"/>
    <circle cx="88" cy="88" r="7" fill="#6366f1"/>
  </g>

  <g transform="translate(420, 215)">
    <text x="0" y="0"
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif"
          font-size="82"
          font-weight="800"
          letter-spacing="-1.5"
          fill="#ffffff">OmniQ<tspan fill="#00e5ff">-OS</tspan></text>

    <text x="4" y="42"
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif"
          font-size="20"
          font-weight="500"
          letter-spacing="4"
          fill="#94a3b8">REAL-TIME QUANTUM LINUX</text>
  </g>
</svg>

