# OmniQ-OS Real-Time Kernel Parameters

# Allow real-time tasks (SCHED_FIFO/SCHED_RR) to consume 100% of CPU without throttling
kernel.sched_rt_runtime_us = -1

# Reduce timer jitter caused by VM statistics
vm.stat_interval = 120

# Disable hung task watchdog timeouts during prolonged pulse synthesis
kernel.hung_task_timeout_secs = 0

# Maximize socket buffer sizes for GPUDirect-QPU telemetry streams
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
