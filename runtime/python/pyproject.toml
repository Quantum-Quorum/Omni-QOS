[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniqos"
version = "0.1.0"
description = "OmniQ-OS: Real-Time Quantum Linux SDK, Framework Adapters & Assembly Studio"
readme = "README.md"
authors = [{ name = "OmniQ Project", email = "developers@omniq.org" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0.0"]
cirq = ["cirq-core>=1.0.0"]
pennylane = ["pennylane>=0.35.0"]
braket = ["amazon-braket-sdk>=1.50.0"]
all = [
    "qiskit>=1.0.0",
    "cirq-core>=1.0.0",
    "pennylane>=0.35.0",
    "amazon-braket-sdk>=1.50.0",
]

[project.scripts]
omniq-studio = "omniqos.studio:main"
qpu = "omniqos.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omniqos*"]
