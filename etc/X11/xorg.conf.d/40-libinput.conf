# ==============================================================================
# OmniQ-OS: Real-Time Quantum Linux
# Primary Input Configuration: etc/X11/xorg.conf.d/40-libinput.conf
# Direct evdev/libinput kernel event processing for VirtualBox USB Tablet,
# QEMU tablets, mice, touchpads & keyboards
# ==============================================================================

Section "InputClass"
    Identifier "evdev catchall"
    MatchDevicePath "/dev/input/event*"
    Driver "evdev"
    Option "XkbLayout" "us"
    Option "XkbModel" "pc105"
EndSection

Section "InputClass"
    Identifier "evdev pointer"
    MatchIsPointer "on"
    MatchDevicePath "/dev/input/event*"
    Driver "evdev"
EndSection

Section "InputClass"
    Identifier "evdev tablet"
    MatchIsTablet "on"
    MatchDevicePath "/dev/input/event*"
    Driver "evdev"
EndSection

Section "InputClass"
    Identifier "evdev touchscreen"
    MatchIsTouchscreen "on"
    MatchDevicePath "/dev/input/event*"
    Driver "evdev"
EndSection

Section "InputClass"
    Identifier "evdev keyboard"
    MatchIsKeyboard "on"
    MatchDevicePath "/dev/input/event*"
    Driver "evdev"
    Option "XkbLayout" "us"
    Option "XkbModel" "pc105"
EndSection

# VirtualBox USB Tablet & Mouse Integration absolute pointer mappings
Section "InputClass"
    Identifier "VirtualBox USB Tablet Direct"
    MatchProduct "VirtualBox USB Tablet"
    MatchDevicePath "/dev/input/event*"
    Driver "evdev"
EndSection

Section "InputClass"
    Identifier "VirtualBox Mouse Integration Direct"
    MatchProduct "VirtualBox mouse integration"
    MatchDevicePath "/dev/input/event*"
    Driver "evdev"
EndSection
