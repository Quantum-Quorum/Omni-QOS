#!/usr/sbin/nft -f
# ==============================================================================
# OmniQ-OS: Real-Time Quantum Linux
# Open-Source nftables Stateful Host Boundary Firewall
# SOC 2 Control: CC6.6 (Logical & PQC Network Boundary Protection)
# ==============================================================================
table inet omniq_soc2_filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow loopback IPC and established telemetry streams
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # Rate-limited ICMP diagnostics
        ip protocol icmp limit rate 20/second accept
        ip6 nexthdr ipv6-icmp limit rate 20/second accept

        # Allow authorized SSH, omniqd telemetry (9090) & PQC Secret API (9443)
        tcp dport { 22, 2222, 9090, 9443 } accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
