# ==============================================================================
# OmniQ-OS v2.0: Cryogenic Dilution Lab Wire-Protocol & Instrument Rack Config
# ==============================================================================
# Default mode (`twin_loopback`) binds LabRackManager to the local multi-protocol
# Hardware-in-the-Loop Digital-Twin Rack (`bin/omniq-lab-twin`) on 127.0.0.1.
#
# PHYSICAL LAB RACK CUTOVER GUIDE (192.168.1.x Cryo Control VLAN):
# To switch directly from Digital-Twin loopback to physical dilution refrigerator
# instruments with zero application code changes, set `mode = physical_lab` and
# update the instrument endpoints to your isolated lab subnet IPs & native ports:
#
#   mode                    = physical_lab
#   lakeshore372_host       = 192.168.1.11
#   lakeshore372_port       = 7777
#   microwave_lo_host       = 192.168.1.12
#   microwave_lo_port       = 5025
#   bluefors_url            = http://192.168.1.10:9098
#   modbus_plc_host         = 192.168.1.20
#   modbus_plc_port         = 502
#   qick_rfsoc_host         = 192.168.1.50
#   qick_rfsoc_port         = 18888
#
# Optional direct POSIX character-device / RS-232 SCPI transports:
#   lakeshore372_transport  = serial:///dev/ttyUSB0?baud=57600
#   microwave_lo_transport  = usbtmc:///dev/usbtmc0
# ==============================================================================

[lab_rack]
mode = twin_loopback

# Lake Shore Model 372 AC Resistance Bridge & RuO2 Thermometry (IEEE-488.2 SCPI)
lakeshore372_host = 127.0.0.1
lakeshore372_port = 17777

# Rohde & Schwarz SGS100A / Keysight EXG Microwave Local Oscillator (LXI SCPI)
microwave_lo_host = 127.0.0.1
microwave_lo_port = 15025

# Bluefors LD400 Dilution Refrigerator Gas Handling & Thermometry HTTP API
bluefors_url = http://127.0.0.1:19098

# Cryogenic Gas-Manifold & HEMT Bias Safety Interlock PLC (Binary RFC Modbus/TCP)
modbus_plc_host = 127.0.0.1
modbus_plc_port = 15020

# Fermilab QICK Xilinx Zynq UltraScale+ RFSoC ZCU216 tProc v2 Controller
qick_rfsoc_host = 127.0.0.1
qick_rfsoc_port = 18888

# Hardware Cryogenic & Vacuum Quench Interlock Thresholds
mxc_interlock_ceiling_mK = 50.0
max_backing_pressure_mbar = 2.50
