corner-radius = 14;
rounded-corners-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "window_type = 'tooltip'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_VERT'"
];

shadow = true;
shadow-radius = 22;
shadow-opacity = 0.52;
shadow-offset-x = -16;
shadow-offset-y = -12;
shadow-color = "#000000";
shadow-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "window_type = 'tooltip'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_VERT'",
    "class_g = 'Omniq-glass-surface'",
    "class_g = 'OmniqDesktop'"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-dim = 0.0;

blur-background-exclude = [
    "window_type = 'desktop'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
vsync = false;
log-level = "warn";

wintypes:
{
    tooltip = { fade = true; shadow = false; opacity = 0.96; focus = true; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.97; };
    dropdown_menu = { opacity = 0.97; };
};
