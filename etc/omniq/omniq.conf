[kernel]
release = "7.0.0-43-generic-omniq-preempt-rt"
scheduler_policy = "SCHED_FIFO"
realtime_priority = 95
isolated_cores = [2, 3]
qec_loop_budget_ns = 600.0
safety_jitter_ceiling_us = 250.0
clock_source = "tsc_reliable"

[qpu_accel]
device = "/dev/accel/qpu0"
driver_module = "/opt/omniq/drivers/omniq_qpu.ko"
sysfs_path = "/sys/class/accel/qpu0"
topology = "heavy_hex_128"
qubits_total = 128
couplers_total = 144
gpudirect_p2p_dma = true
zero_copy_shm = "/dev/shm/omniq_qpu0"
shm_size_kb = 64

[cryo_safety]
mxc_target_mk = 14.25
mxc_max_operating_mk = 50.0
still_plate_mk = 782.0
stage_4k_k = 3.82
stage_50k_k = 48.21
rf_interlock_auto_clamp = true
vacuum_ceiling_mbar = 1.0e-7

[qmmu]
spatial_multitenancy = true
guard_band_qubits = 2
dynamic_decoupling = "XY8"
keepalive_daemon = "q-keepalived"

[pqc_security]
kem_algorithm = "ML-KEM-1024"
signature_algorithm = "ML-DSA-87"
secret_api_port = 9443
soc2_type2_enforced = true

[ipc]
control_socket = "/tmp/omniq_qpu0.sock"
telemetry_port = 9090
console_device = "/dev/ttyS0"
baud_rate = 115200
